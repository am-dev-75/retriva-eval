[project]
name = "retriva-eval"
version = "0.1.0"
description = "Continuous evaluation harness for the Retriva RAG system"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "qdrant-client>=1.9",
  "ragas>=0.2",
  "langchain-community>=0.2",
  "langchain-openai>=0.1",
  "pandas>=2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10"
]

[project.scripts]
retriva-eval = "retriva_eval.cli:app"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
