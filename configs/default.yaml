retriva:
  adapter: http
  endpoint_env: RETRIVA_ENDPOINT
  timeout_seconds: 60
  default_top_k: 5

qdrant:
  url_env: QDRANT_URL
  api_key_env: QDRANT_API_KEY
  collection_name: retriva_eval_manual
  vector_size: 1536
  distance: cosine
  collection_lifecycle:
    mode: manual_existing
    delete_on_completion: false

llm:
  provider: openai
  model: gpt-4o-mini

evaluation:
  reports_dir: reports
  fail_on_threshold_breach: true
