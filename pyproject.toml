[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retriva-eval"
version = "0.1.0"
description = "Continuous evaluation and regression-testing framework for Retriva."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.4.0",
    "pyyaml>=6.0.1",
    "qdrant-client>=1.6.0",
    "ragas>=0.1.0",
    "httpx>=0.25.0",
    "datasets>=2.14.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[project.scripts]
retriva-eval = "retriva_eval.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"
